<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go-Goated Racing</title>
    <style>
      /* Game fonts from the asset dump, used per the user's own labels on the
         source files: Freckle Face for general in-game text, Playfair Display
         for chat specifically. Both are Google Fonts under the Open Font
         License — safe to self-host in a public repo. (Pervitina Dex, labeled
         "for headers and logos," was skipped: its own license file says
         free-for-personal-use-only, which doesn't sit well with a public repo
         and live site — the logo is a custom image already, not font text,
         so nothing actually needed it.) */
      @font-face {
        font-family: "FreckleFace";
        src: url("%BASE_URL%fonts/FreckleFace-Regular.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "PlayfairDisplay";
        src: url("%BASE_URL%fonts/PlayfairDisplay-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "PlayfairDisplay";
        src: url("%BASE_URL%fonts/PlayfairDisplay-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: "PlayfairDisplay";
        src: url("%BASE_URL%fonts/PlayfairDisplay-Italic.ttf") format("truetype");
        font-style: italic;
        font-display: swap;
      }

      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

      #hud {
        position: fixed; top: 12px; left: 16px; color: #fff; font: 14px/1.4 "FreckleFace", monospace;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none; user-select: none;
      }
      #hud .hint { opacity: 0.7; font-size: 12px; }
      #hud.hidden { display: none; }

      /* Shared full-screen panel convention: one sibling per step of the flow
         (Entry -> Map Select -> Car Select -> Settings), each a fixed overlay
         toggled by .hidden, each sliding/fading in via .entering so forward vs.
         backward navigation reads as directional rather than a flat cross-fade. */
      .screenPanel {
        position: fixed; inset: 0; color: #eee; font: 14px/1.4 "FreckleFace", monospace;
        display: flex; flex-direction: column; align-items: center;
        transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1.1);
      }
      .screenPanel.hidden { display: none; }
      .screenPanel.entering-forward { animation: panelInForward 0.4s cubic-bezier(0.2, 0.8, 0.3, 1.1); }
      .screenPanel.entering-back { animation: panelInBack 0.4s cubic-bezier(0.2, 0.8, 0.3, 1.1); }
      @keyframes panelInForward {
        from { opacity: 0; transform: translateX(28px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes panelInBack {
        from { opacity: 0; transform: translateX(-28px); }
        to { opacity: 1; transform: translateX(0); }
      }

      #entryScreen {
        background: transparent; justify-content: flex-end; padding-bottom: 12%; pointer-events: none;
      }
      #entryScreen > * { pointer-events: auto; }
      #logoMark {
        position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
        width: min(440px, 80vw); aspect-ratio: 2000 / 1000; pointer-events: none;
      }
      #logoMark::before {
        content: ""; position: absolute; inset: 0;
        background-image: url('%BASE_URL%branding/logo.png');
        background-size: contain; background-repeat: no-repeat; background-position: center;
      }
      #logoMark::after {
        content: ""; position: absolute; inset: 0;
        -webkit-mask-image: url('%BASE_URL%branding/logo-fill.png');
        mask-image: url('%BASE_URL%branding/logo-fill.png');
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-position: center; mask-position: center;
        background: linear-gradient(115deg, #0c0c0c 0%, #5c5c5c 33%, #ffffff 50%, #5c5c5c 67%, #0c0c0c 100%);
        background-size: 260% 100%;
        animation: logoShimmer 5s ease-in-out infinite;
      }
      @keyframes logoShimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      #entryPlayButton {
        padding: 14px 44px; font: 16px "FreckleFace", monospace; letter-spacing: 2px;
        background: #333; color: #fff; border: 1px solid #888; cursor: pointer;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      }
      #entryMenuButtons { display: flex; gap: 10px; margin-top: 10px; }
      #settingsButton {
        padding: 10px 20px; font: 14px "FreckleFace", monospace; background: #222; color: #ccc;
        border: 1px solid #555; cursor: pointer;
      }

      /* --- Map Select / Car Select: a title, a horizontal filmstrip of baked-image
         tiles (not a generic centered card grid), and a next/back footer. --- */
      #mapSelect, #carSelect { background: rgba(5,6,9,0.55); justify-content: center; }
      .selectTitle {
        font-size: 13px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.6;
        margin: 0 0 14px;
      }
      .filmstrip {
        display: flex; gap: 14px; overflow-x: auto; padding: 6px 4px 18px;
        max-width: 92vw; scroll-snap-type: x proximity;
      }
      .thumbTile {
        position: relative; flex: 0 0 auto; width: 220px; cursor: pointer; scroll-snap-align: center;
        border: 1px solid #3a3a3a; background: #141416;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .thumbTile img { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
      .mapTile img { aspect-ratio: 8 / 5; }
      .thumbTile .thumbLabel {
        padding: 8px 10px; font-size: 13px; letter-spacing: 1px;
        display: flex; justify-content: space-between; align-items: baseline;
      }
      .thumbTile .thumbLabel .stat { font-size: 10px; opacity: 0.55; }
      .thumbTile:hover { border-color: #888; transform: translateY(-2px); }
      .thumbTile.selected { border-color: #ffb347; box-shadow: 0 0 0 1px #ffb347 inset; }
      .thumbTile.selected .thumbLabel { background: #241c10; color: #ffd37a; }

      /* Animated stat-bar reveal on the selected car tile — Forza/GT-style spec
         sheet, not a static number, so picking a car actually feels like a choice. */
      .statBars { padding: 0 10px 10px; display: none; flex-direction: column; gap: 4px; }
      .thumbTile.selected .statBars { display: flex; }
      .statBarRow { display: flex; align-items: center; gap: 6px; font-size: 9px; opacity: 0.8; }
      .statBarRow .statName { width: 34px; letter-spacing: 1px; }
      .statBarTrack { flex: 1; height: 4px; background: #2a2a2a; }
      .statBarFill {
        height: 100%; background: #ffb347; width: 0%;
        transition: width 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.1);
      }

      .selectFooter { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
      .selectFooter button {
        padding: 10px 24px; font: 14px "FreckleFace", monospace; cursor: pointer;
      }
      .selectBackButton { background: #222; color: #ccc; border: 1px solid #555; }
      .selectNextButton {
        background: #333; color: #fff; border: 1px solid #888;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      }
      .selectNextButton:disabled { opacity: 0.4; cursor: default; }
      .selectFlavor { font-size: 12px; opacity: 0.6; margin: -6px 0 14px; max-width: 400px; text-align: center; }

      #mapSelect #envToggles { width: 220px; margin: 4px 0 18px; }
      #carSelect #paintRow, #carSelect #plateRow { width: 220px; }
      #carSelect .customizeRow { display: flex; gap: 20px; margin: 4px 0 18px; }

      #paintRow { width: 220px; margin-bottom: 14px; }
      #paintLabel {
        display: flex; justify-content: space-between; font-size: 11px; opacity: 0.6;
        margin-bottom: 4px; letter-spacing: 1px;
      }
      #colorSlider {
        -webkit-appearance: none; appearance: none; width: 100%; height: 18px;
        border: 1px solid #444; cursor: pointer; margin: 0; display: block;
        background: linear-gradient(
          to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000
        );
      }
      #colorSlider::-webkit-slider-thumb {
        -webkit-appearance: none; width: 12px; height: 24px; margin-top: -4px;
        background: #fff; border: 2px solid #111; cursor: pointer;
      }
      #colorSlider::-moz-range-thumb {
        width: 12px; height: 24px; background: #fff; border: 2px solid #111; cursor: pointer;
      }
      #colorSlider::-moz-range-track { height: 18px; border: none; }

      #plateRow { width: 220px; margin-bottom: 14px; }
      #plateLabel { font-size: 11px; opacity: 0.6; margin-bottom: 4px; letter-spacing: 1px; }
      #plateInput {
        width: 100%; box-sizing: border-box; padding: 7px 8px; font: 13px "FreckleFace", monospace;
        letter-spacing: 2px; text-transform: uppercase; background: #1a1a1a; color: #eee;
        border: 1px solid #3a3a3a;
      }
      #plateInput:focus { outline: none; border-color: #888; }

      #envToggles { width: 220px; margin-bottom: 14px; }
      .envRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .envRow span { width: 60px; font-size: 11px; opacity: 0.75; }
      .envRow .envOptions { display: flex; gap: 4px; flex: 1; }
      .envRow button {
        flex: 1; padding: 5px; font: 11px "FreckleFace", monospace; background: #1a1a1a; color: #bbb;
        border: 1px solid #3a3a3a; cursor: pointer;
      }
      .envRow button.selected { background: #333; color: #fff; border-color: #888; }
      #nicknameRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      #nicknameRow span { width: 60px; font-size: 11px; opacity: 0.75; }
      #nicknameInput {
        flex: 1; box-sizing: border-box; padding: 5px 7px; font: 12px "FreckleFace", monospace;
        background: #1a1a1a; color: #eee; border: 1px solid #3a3a3a;
      }
      #nicknameInput:focus { outline: none; border-color: #888; }
      #settings {
        position: fixed; inset: 0; background: #111;
        color: #eee; font: 14px/1.4 "FreckleFace", monospace;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #settings.hidden { display: none; }
      #settings h1 { font-size: 20px; margin: 0 0 24px; font-weight: normal; }
      .settingsGroup { width: 260px; margin-bottom: 20px; }
      .settingsGroup h2 { font-size: 13px; font-weight: normal; opacity: 0.7; margin: 0 0 8px; }
      .presetRow { display: flex; gap: 8px; }
      .presetRow button {
        flex: 1; padding: 8px; font: 13px "FreckleFace", monospace; background: #222; color: #ccc;
        border: 1px solid #444; cursor: pointer;
      }
      .presetRow button.selected { background: #333; color: #fff; border-color: #888; }
      .sliderRow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .sliderRow label { width: 70px; font-size: 12px; opacity: 0.85; }
      .sliderRow input[type="range"] { flex: 1; }
      .sliderRow .value { width: 32px; text-align: right; font-size: 12px; opacity: 0.7; }

      .bindRow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .bindRow label { width: 90px; font-size: 12px; opacity: 0.85; }
      .bindRow button {
        flex: 1; padding: 6px; font: 12px "FreckleFace", monospace; background: #1a1a1a; color: #ccc;
        border: 1px solid #3a3a3a; cursor: pointer; letter-spacing: 1px;
      }
      .bindRow button.listening { background: #3a2f0a; color: #ffd37a; border-color: #a9822e; }
      #resetBindings {
        width: 100%; margin-top: 4px; padding: 6px; font: 11px "FreckleFace", monospace;
        background: #1a1a1a; color: #999; border: 1px solid #3a3a3a; cursor: pointer;
      }
      #settingsBack {
        padding: 10px 28px; font: 14px "FreckleFace", monospace; background: #333; color: #fff;
        border: 1px solid #888; cursor: pointer;
      }

      #chatLog {
        position: fixed; left: 16px; bottom: 54px; width: 320px; max-height: 150px;
        display: flex; flex-direction: column-reverse; gap: 4px; overflow: hidden;
        pointer-events: none; font: 13px/1.3 "PlayfairDisplay", serif; z-index: 500;
      }
      #chatLog.hidden { display: none; }
      .chatMsg {
        color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); transition: opacity 1s ease;
        word-break: break-word;
      }
      .chatMsg .chatName { opacity: 0.65; margin-right: 4px; }
      #chatInputRow {
        position: fixed; left: 16px; bottom: 16px; width: 320px; z-index: 501;
      }
      #chatInputRow.hidden { display: none; }
      #chatInput {
        width: 100%; box-sizing: border-box; padding: 7px 9px; font: 13px "PlayfairDisplay", serif;
        background: rgba(17,17,17,0.9); color: #fff; border: 1px solid #666;
      }
      #chatInput:focus { outline: none; border-color: #999; }

      #backButton {
        position: fixed; top: 12px; right: 16px; padding: 6px 12px; font: 12px "FreckleFace", monospace;
        background: #222; color: #ccc; border: 1px solid #555; cursor: pointer;
      }
      #backButton.hidden { display: none; }

      #loadingScreen {
        position: fixed; inset: 0; background: #000; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; transition: opacity 0.6s ease;
      }
      #loadingScreen.hidden { opacity: 0; pointer-events: none; }
      #loadingSpinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 2px solid #333; border-top-color: #999;
        animation: loadingSpin 0.9s linear infinite;
      }
      @keyframes loadingSpin { to { transform: rotate(360deg); } }
      #loadingBarTrack {
        width: 220px; height: 3px; background: #262626; border: 1px solid #3a3a3a;
      }
      #loadingBarFill { width: 0%; height: 100%; background: #999; transition: width 0.25s ease; }
      #loadingLabel {
        color: #888; font: 12px/1.4 "FreckleFace", monospace; letter-spacing: 1px; text-transform: uppercase;
      }
      #loadingTip {
        color: #665; font: 12px/1.4 "FreckleFace", monospace; opacity: 0.55; max-width: 320px;
        text-align: center; min-height: 1.4em; transition: opacity 0.3s ease;
      }

      body.booting #entryScreen, body.booting #renderCanvas { opacity: 0; }
      #renderCanvas { transition: opacity 0.6s ease; }
      #entryScreen { transition: opacity 0.6s ease; }

      #sceneFade {
        position: fixed; inset: 0; background: #000; z-index: 9000;
        opacity: 0; pointer-events: none; transition: opacity 0.45s ease;
      }
      #sceneFade.active { opacity: 1; }

      /* --- A little life: every clickable control eases instead of snapping. --- */
      button {
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
      }
      button:not(:disabled):hover { border-color: #999; }
      button:not(:disabled):active { transform: scale(0.96); }
      .envRow button:not(:disabled):hover,
      .presetRow button:not(:disabled):hover { background: #2a2a2a; }
      #playButton:not(:disabled):hover { background: #3d3d3d; border-color: #aaa; }
      #settingsButton:hover, #settingsBack:hover, #backButton:hover { background: #2c2c2c; }

      #settings {
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      #settings.hidden { opacity: 0; transform: scale(0.98); pointer-events: none; display: flex; }
    </style>
  </head>
  <body class="booting">
    <canvas id="renderCanvas"></canvas>
    <div id="sceneFade"></div>

    <div id="loadingScreen">
      <div id="loadingSpinner"></div>
      <div id="loadingBarTrack"><div id="loadingBarFill"></div></div>
      <div id="loadingLabel"><span id="loadingLabelText">Loading</span> <span id="loadingPercent">0%</span></div>
      <div id="loadingTip"></div>
    </div>

    <div id="entryScreen" class="screenPanel">
      <div id="logoMark" role="img" aria-label="Go-Goated Racing"></div>
      <button id="entryPlayButton">Play</button>
      <div id="entryMenuButtons">
        <button id="settingsButton">Settings</button>
      </div>
    </div>

    <div id="mapSelect" class="screenPanel hidden">
      <div class="selectTitle">Select Track</div>
      <div class="filmstrip" id="mapList"></div>
      <div class="selectFlavor" id="mapFlavorText"></div>
      <div id="envToggles">
        <div class="envRow">
          <span>Time</span>
          <div class="envOptions" id="timeOfDayRow">
            <button data-value="day">Day</button>
            <button data-value="night">Night</button>
          </div>
        </div>
        <div class="envRow">
          <span>Weather</span>
          <div class="envOptions" id="weatherRow">
            <button data-value="clear">Clear</button>
            <button data-value="cloudy">Cloudy</button>
            <button data-value="snow">Snow</button>
          </div>
        </div>
        <div class="envRow">
          <span>Online</span>
          <div class="envOptions" id="multiplayerRow">
            <button data-value="off">Off</button>
            <button data-value="on">Join (LAN)</button>
          </div>
        </div>
        <div id="nicknameRow">
          <span>Name</span>
          <input type="text" id="nicknameInput" maxlength="16" placeholder="Player" spellcheck="false" />
        </div>
      </div>
      <div class="selectFooter">
        <button class="selectBackButton" id="mapSelectBack">Back</button>
        <button class="selectNextButton" id="mapSelectNext" disabled>Next</button>
      </div>
    </div>

    <div id="carSelect" class="screenPanel hidden">
      <div class="selectTitle">Select Car</div>
      <div class="filmstrip" id="carList"></div>
      <div class="customizeRow">
        <div id="paintRow">
          <div id="paintLabel"><span>Paint</span><span id="paintHueValue">210°</span></div>
          <input type="range" id="colorSlider" min="0" max="359" value="210" />
        </div>
        <div id="plateRow">
          <div id="plateLabel">Plate</div>
          <input type="text" id="plateInput" maxlength="8" value="STUNT" spellcheck="false" />
        </div>
      </div>
      <div class="selectFooter">
        <button class="selectBackButton" id="carSelectBack">Back</button>
        <button class="selectNextButton" id="playButton">Play</button>
      </div>
    </div>

    <div id="settings" class="hidden">
      <h1>Settings</h1>
      <div class="settingsGroup">
        <h2>Graphics</h2>
        <div class="presetRow" id="presetRow">
          <button data-preset="low">Low</button>
          <button data-preset="medium">Medium</button>
          <button data-preset="high">High</button>
        </div>
      </div>
      <div class="settingsGroup">
        <h2>Audio</h2>
        <div class="sliderRow">
          <label for="masterVolume">Master</label>
          <input type="range" id="masterVolume" min="0" max="100" value="70" />
          <span class="value" id="masterVolumeValue">70</span>
        </div>
        <div class="sliderRow">
          <label for="engineVolume">Engine</label>
          <input type="range" id="engineVolume" min="0" max="100" value="80" />
          <span class="value" id="engineVolumeValue">80</span>
        </div>
      </div>
      <div class="settingsGroup">
        <h2>Controls</h2>
        <div class="bindRow"><label>Forward</label><button id="bindForward" data-action="forward"></button></div>
        <div class="bindRow"><label>Back</label><button id="bindBack" data-action="back"></button></div>
        <div class="bindRow"><label>Left</label><button id="bindLeft" data-action="left"></button></div>
        <div class="bindRow"><label>Right</label><button id="bindRight" data-action="right"></button></div>
        <div class="bindRow"><label>Air control</label><button id="bindAirControl" data-action="airControl"></button></div>
        <div class="bindRow"><label>Reset car</label><button id="bindReset" data-action="reset"></button></div>
        <div class="bindRow"><label>Headlights</label><button id="bindHeadlights" data-action="headlights"></button></div>
        <button id="resetBindings">Reset to defaults</button>
      </div>
      <button id="settingsBack">Back</button>
    </div>

    <div id="hud" class="hidden">
      <div id="speed">0 mph</div>
      <div id="cameraMode" class="hint">Chase</div>
      <div id="peerCount" class="hidden"></div>
      <div class="hint" id="controlsHint">WASD/Arrows drive &middot; Space air control + Arrows/Mouse to flip &middot; R reset &middot; H headlights &middot; C camera &middot; Enter chat</div>
    </div>
    <div id="chatLog" class="hidden"></div>
    <div id="chatInputRow" class="hidden">
      <input type="text" id="chatInput" maxlength="120" placeholder="Press Enter to send, Esc to cancel" spellcheck="false" />
    </div>
    <button id="backButton" class="hidden">Menu</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
